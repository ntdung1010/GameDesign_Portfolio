# Netlify: rebuild site/ from portfolio.html on every deploy, then publish only that folder.
# This file overrides the build settings in the Netlify dashboard.
[build]
  command = "python3 build_site.py"
  publish = "site"

# Icons rarely change: let browsers keep them for a week instead of re-checking on every visit
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
